# Runs when the internal repository pushes a version tag (v0.1.0, ...).
# Swift Package Manager picks the tag up by itself; this publishes the Kotlin artifacts
# to Maven Central and creates the GitHub release.
#
# Secrets (Settings › Secrets and variables › Actions):
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  Central Portal user token
#   SIGNING_KEY / SIGNING_KEY_PASSWORD               ASCII-armored GPG private key and its passphrase
name: Release

on:
  push:
    tags: ["v*"]
  # Manual re-run for an existing tag (e.g. when the tag push did not start this workflow).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        env: { INPUT_TAG: "${{ inputs.tag }}" }
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a version tag: $TAG"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Test
        working-directory: kotlin
        run: gradle --no-daemon :core:test
      - name: Publish to Maven Central
        working-directory: kotlin
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        # Uploads and validates; the release is confirmed by hand in the Central Portal
        # (automaticRelease = false) until the process has run a few times.
        run: gradle --no-daemon -PwithAndroid=true -PVERSION_NAME="$VERSION" publishToMavenCentral
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes
