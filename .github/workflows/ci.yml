name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift-linux:
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  swift-apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: xcodebuild -scheme IntentgateBasicAuth-Package -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - run: gradle --no-daemon :core:test
        working-directory: kotlin
      # The runner image ships the Android SDK (ANDROID_HOME).
      - run: gradle --no-daemon -PwithAndroid=true :android:assembleRelease
        working-directory: kotlin
