# Coordinates and POM data shared by :core and :android (Maven Central requires all of these).
GROUP=id.intentgate
# The release workflow overrides this from the git tag (v0.1.0 -> 0.1.0).
VERSION_NAME=0.1.0

POM_URL=https://github.com/Intentgate-id/SDK_kit
POM_SCM_URL=https://github.com/Intentgate-id/SDK_kit
POM_SCM_CONNECTION=scm:git:https://github.com/Intentgate-id/SDK_kit.git
POM_DEVELOPER_ID=intentgate
POM_DEVELOPER_NAME=Intentgate
POM_DEVELOPER_URL=https://intentgate.id

# The client SDK is Apache-2.0 (distribution/LICENSE). Maven Central requires these.
POM_LICENSE_NAME=Apache-2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo

kotlin.code.style=official

# The Android module depends on AndroidX (Credential Manager).
android.useAndroidX=true
