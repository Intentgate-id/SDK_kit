openapi: 3.1.0
info:
  title: Intentgate basic-auth API
  version: 0.2.0
  description: |
    パスキー（FIDO2）で承認する打刻の API です。作業員アプリはオンラインで使います（spec/PROTOCOL.md）。

    - **テナント API キー**（`igk_live_...` / `igk_test_...`）: 自社バックエンドから使います。アプリに埋め込まないでください。
    - **端末トークン**（`igd_...`）: 作業員アプリが打刻の申請と完了にだけ使います。

    テスト用キーはテスト用のデータだけを扱い、課金されません。どちらのキーかは `GET /v1/account` で確認できます。
    エラーはすべて `{"error": {"code": "...", "message": "..."}}` の形で返ります。
servers:
  - url: https://checkin.intentgate.id
    description: 本番とテストで共通（API キーでモードが決まる）
security:
  - apiKey: []
tags:
  - name: account
  - name: workers
    description: 作業員とパスキー
  - name: devices
    description: 作業員の端末
  - name: worker-app
    description: 作業員アプリが端末トークンで呼ぶもの
  - name: sites
    description: 現場（位置と半径）と割り当て
  - name: events
    description: 打刻の記録と証跡
  - name: usage
    description: 課金単位（作業員 × 現場 × 日）

paths:
  /v1/account:
    get:
      operationId: getAccount
      tags: [account]
      summary: キーのアカウントとモードを返す
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/workers:
    get:
      operationId: listWorkers
      tags: [workers]
      summary: 作業員の一覧（自社の作業員と、自社の現場に割り当てた他社の作業員。最大 500 件）
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 名前・external_ref・ID で絞り込む }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [workers]
                properties:
                  workers: { type: array, items: { $ref: "#/components/schemas/WorkerSummary" } }
    post:
      operationId: createWorker
      tags: [workers]
      summary: 作業員を作る
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: { type: string, example: 佐藤 一郎 }
                external_ref: { type: string, description: 社員番号など。テナント内で一意, example: Y-0012 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  worker: { $ref: "#/components/schemas/Worker" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/workers/{id}:
    get:
      operationId: getWorker
      tags: [workers]
      summary: 作業員の詳細（パスキー、端末、割り当て）
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  worker: { $ref: "#/components/schemas/Worker" }
                  passkeys:
                    type: array
                    items:
                      type: object
                      properties:
                        credential_id: { type: string }
                        created_at: { type: string, format: date-time }
                        revoked_at: { type: [string, "null"], format: date-time }
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        created_at: { type: string, format: date-time }
                        last_seen_at: { type: [string, "null"], format: date-time }
                        revoked_at: { type: [string, "null"], format: date-time }
                  assignments: { type: array, items: { $ref: "#/components/schemas/Assignment" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workers/{id}/passkeys/options:
    post:
      operationId: createPasskeyOptions
      tags: [workers]
      summary: パスキー登録のオプションを取得する
      description: |
        `options` をアプリに渡し、`challenge_id` は自社バックエンドに残します。
        チャレンジは 5 分で切れ、一度しか使えません。UV（本人確認）は必須です。
        **呼ぶ前に作業員の本人確認を済ませてください。**
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [challenge_id, options]
                properties:
                  challenge_id: { type: string }
                  options:
                    type: object
                    description: WebAuthn PublicKeyCredentialCreationOptionsJSON
  /v1/workers/{id}/passkeys:
    post:
      operationId: registerPasskey
      tags: [workers]
      summary: アプリが作ったパスキーを検証して保存する
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, response]
              properties:
                challenge_id: { type: string }
                response: { type: object, description: WebAuthn RegistrationResponseJSON }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  passkey:
                    type: object
                    properties:
                      credential_id: { type: string }
                      worker_id: { type: string }
        "400":
          description: "`invalid_challenge`（不明・使用済み・期限切れ）または `invalid_registration`（RP ID・オリジン・UV の不一致など）"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/passkeys/{credentialId}:
    delete:
      operationId: revokePasskey
      tags: [workers]
      summary: パスキーを失効させる（端末の紛失など）
      parameters:
        - { name: credentialId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 失効しました }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workers/{id}/devices:
    post:
      operationId: createDevice
      tags: [devices]
      summary: 作業員の端末を発行する
      description: "`device_token` は一度だけ返ります。自社の認証済みチャネルでアプリに渡してください。"
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [device, device_token]
                properties:
                  device:
                    type: object
                    properties:
                      id: { type: string }
                      worker_id: { type: string }
                  device_token: { type: string, example: igd_... }

  /v1/devices/{id}:
    delete:
      operationId: revokeDevice
      tags: [devices]
      summary: 端末を失効させる（機種変更、紛失）
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "204": { description: 失効しました }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/devices/{id}/checkins:
    post:
      operationId: startCheckIn
      tags: [worker-app]
      summary: 打刻を申請する（サーバーがイベントを確定し、チャレンジを発行する）
      description: |
        応答の `event` が申請どおりかを SDK で確かめてから（`checkIssuedCheckIn`）、`challenge` をパスキーで署名し、
        期限（既定 180 秒）内に complete を呼んでください。位置が現場から外れていても拒否はせず、記録にフラグが付きます。
      security: [{ deviceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckInRequest" }
      responses:
        "201":
          description: 発行しました
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedCheckIn" }
        "400":
          description: "`malformed_request`、`unknown_event_type`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: トークンが別の端末のもの
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`site_location_missing`（現場の位置が未設定）、`no_passkey`（作業員にパスキーがない）"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/devices/{id}/checkins/{checkinId}/complete:
    post:
      operationId: completeCheckIn
      tags: [worker-app]
      summary: パスキーの署名を渡して打刻を確定する（再送しても重複しない）
      security: [{ deviceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: checkinId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assertion]
              properties:
                assertion: { type: object, description: WebAuthn AuthenticationResponseJSON }
      responses:
        "200":
          description: 記録しました。同じ打刻の 2 回目以降は `duplicate` で同じ結果を返します。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckInResult" }
        "400":
          description: "`invalid_signature`、`unknown_credential`、`credential_device_mismatch`、`malformed_request`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`unknown_checkin`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "410":
          description: "`checkin_expired`: 期限切れ。申請からやり直してください"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/sites:
    get:
      operationId: listSites
      tags: [sites]
      summary: 現場の一覧
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sites: { type: array, items: { $ref: "#/components/schemas/SiteSummary" } }
    post:
      operationId: createSite
      tags: [sites]
      summary: 現場を作る
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, time_zone, latitude, longitude, radius_m]
              properties:
                name: { type: string, example: 渋谷二丁目新築工事 }
                time_zone: { type: string, description: IANA タイムゾーン。打刻の日付はこれで数える, example: Asia/Tokyo }
                latitude: { type: number, minimum: -90, maximum: 90, example: 35.658 }
                longitude: { type: number, minimum: -180, maximum: 180, example: 139.7016 }
                radius_m: { type: integer, minimum: 10, maximum: 5000, description: 現場とみなす半径（メートル）, example: 150 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  site: { $ref: "#/components/schemas/Site" }

  /v1/sites/{id}:
    get:
      operationId: getSite
      tags: [sites]
      summary: 現場の詳細（割り当て）
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  site: { $ref: "#/components/schemas/Site" }
                  assignments:
                    type: array
                    items:
                      type: object
                      properties:
                        worker_id: { type: string }
                        display_name: { type: string }
                        owned: { type: boolean, description: 自社の作業員か }
                        starts_on: { type: string, format: date }
                        ends_on: { type: [string, "null"], format: date }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateSite
      tags: [sites]
      summary: 現場の名前、タイムゾーン、位置と半径を変える（位置は 3 つまとめて）
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                time_zone: { type: string }
                latitude: { type: number }
                longitude: { type: number }
                radius_m: { type: integer, minimum: 10, maximum: 5000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  site: { $ref: "#/components/schemas/Site" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/sites/{id}/assignments:
    post:
      operationId: assignWorker
      tags: [sites]
      summary: 作業員を現場に割り当てる（他社の作業員も可。本番とテストをまたぐことはできない）
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id, starts_on]
              properties:
                worker_id: { type: string }
                starts_on: { type: string, format: date }
                ends_on: { type: string, format: date }
      responses:
        "201": { description: Created（同じ組み合わせは期間を上書き） }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/sites/{id}/assignments/{workerId}:
    delete:
      operationId: unassignWorker
      tags: [sites]
      summary: 割り当てを外す
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: workerId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 外しました }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/events:
    get:
      operationId: listEvents
      tags: [events]
      summary: 打刻の記録（最大 5000 件、超えたら truncated）
      parameters:
        - { $ref: "#/components/parameters/from" }
        - { $ref: "#/components/parameters/to" }
        - { name: site_id, in: query, schema: { type: string } }
        - { name: worker_id, in: query, schema: { type: string } }
        - { name: flagged, in: query, schema: { type: string, enum: ["true"] }, description: 要確認のものだけ }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  truncated: { type: boolean }
                  events: { type: array, items: { $ref: "#/components/schemas/CheckInRow" } }

  /v1/events.csv:
    get:
      operationId: exportEventsCsv
      tags: [events]
      summary: 打刻の記録の CSV（UTF-8 BOM 付き、Excel でそのまま開ける）
      parameters:
        - { $ref: "#/components/parameters/from" }
        - { $ref: "#/components/parameters/to" }
        - { name: site_id, in: query, schema: { type: string } }
        - { name: worker_id, in: query, schema: { type: string } }
        - { name: flagged, in: query, schema: { type: string, enum: ["true"] } }
      responses:
        "200":
          description: OK
          content:
            text/csv: { schema: { type: string } }

  /v1/events/{checkinId}:
    get:
      operationId: getEventEvidence
      tags: [events]
      summary: 1 件の打刻の署名済み証跡（監査用）
      parameters:
        - { name: checkinId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 署名された記録（event と assertion）そのもの。パスキーの公開鍵で誰でも検証できます
          content:
            application/json:
              schema:
                type: object
                properties:
                  record:
                    type: object
                    properties:
                      event: { $ref: "#/components/schemas/CheckInEvent" }
                      assertion: { type: object, description: WebAuthn AuthenticationResponseJSON }
                  flags: { type: array, items: { $ref: "#/components/schemas/Flag" } }
                  distance_m: { type: integer }
                  credential_id: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/usage:
    get:
      operationId: getUsage
      tags: [usage]
      summary: 課金単位（作業員 × 現場 × 日）の明細
      parameters:
        - { $ref: "#/components/parameters/from" }
        - { $ref: "#/components/parameters/to" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  mode: { $ref: "#/components/schemas/Mode" }
                  billable_units: { type: integer, description: 課金単位の数（テストモードでは請求されない） }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        site_id: { type: string }
                        site_name: { type: string }
                        worker_id: { type: string }
                        worker_name: { type: string }
                        date: { type: string, format: date }
                        events: { type: integer, description: その日その現場での打刻数 }

  /v1/usage.csv:
    get:
      operationId: exportUsageCsv
      tags: [usage]
      summary: 課金単位の CSV
      parameters:
        - { $ref: "#/components/parameters/from" }
        - { $ref: "#/components/parameters/to" }
      responses:
        "200":
          description: OK
          content:
            text/csv: { schema: { type: string } }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: テナント API キー（igk_live_... / igk_test_...）
    deviceToken:
      type: http
      scheme: bearer
      description: 端末トークン（igd_...）

  parameters:
    id: { name: id, in: path, required: true, schema: { type: string } }
    from: { name: from, in: query, required: true, schema: { type: string, format: date }, description: 現場の現地日付（YYYY-MM-DD） }
    to: { name: to, in: query, required: true, schema: { type: string, format: date } }

  responses:
    Unauthorized:
      description: キーがない、無効、失効済み、またはテナントが停止中
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: 見つからない（他のテナントや別のモードのものも 404）
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: すでに登録されている
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [unauthorized, forbidden, not_found, conflict, invalid_request, invalid_challenge, invalid_registration, invalid_signature, checkin_expired] }
            message: { type: string }

    Mode: { type: string, enum: [live, test] }

    Account:
      type: object
      properties:
        account_id: { type: string, description: 契約単位の ID（本番のテナント ID） }
        tenant_id: { type: string, description: このキーのテナント。テストでは別の ID }
        name: { type: string }
        mode: { $ref: "#/components/schemas/Mode" }
        livemode: { type: boolean }
        rp_id: { type: string, description: パスキーの RP ID }
        origins: { type: array, items: { type: string }, description: 受け付けるオリジン（https://... または android:apk-key-hash:...） }

    Worker:
      type: object
      properties:
        id: { type: string, example: wrk_... }
        display_name: { type: string }
        external_ref: { type: [string, "null"] }
        owned: { type: boolean }
    WorkerSummary:
      allOf:
        - { $ref: "#/components/schemas/Worker" }
        - type: object
          properties:
            created_at: { type: string, format: date-time }
            passkeys: { type: integer }
            devices: { type: integer }
            last_checkin: { type: [integer, "null"], description: 最後の打刻の時刻（unix 秒） }

    Site:
      type: object
      properties:
        id: { type: string, example: site_... }
        name: { type: string }
        time_zone: { type: string }
        latitude: { type: [number, "null"], description: 現場の中心（未設定なら null。打刻できない） }
        longitude: { type: [number, "null"] }
        radius_m: { type: [integer, "null"] }
    SiteSummary:
      allOf:
        - { $ref: "#/components/schemas/Site" }
        - type: object
          properties:
            created_at: { type: string, format: date-time }
            assigned_workers: { type: integer, description: 今日割り当てのある人数 }
            last_checkin: { type: [integer, "null"] }

    Assignment:
      type: object
      properties:
        site_id: { type: string }
        site_name: { type: string }
        starts_on: { type: string, format: date }
        ends_on: { type: [string, "null"], format: date }

    CheckInRequest:
      type: object
      required: [type, site_id, location]
      properties:
        type: { type: string, example: site_entry }
        site_id: { type: string }
        location:
          type: object
          required: [latitude, longitude, accuracy_m]
          properties:
            latitude: { type: number, example: 35.681236 }
            longitude: { type: number, example: 139.76712 }
            accuracy_m: { type: number, description: 端末が報告した水平精度（メートル）, example: 11.4 }
        attributes: { type: object, description: 自由な追加情報（署名の対象。Intentgate は値を検証しない） }

    IssuedCheckIn:
      type: object
      required: [checkin_id, event, challenge, expires_at, rp_id, allow_credentials]
      properties:
        checkin_id: { type: string, example: chk_... }
        event: { $ref: "#/components/schemas/CheckInEvent" }
        challenge: { type: string, description: "SHA-256(\"intentgate-basic-auth/v2\" || 0x00 || JCS(event))（base64url）" }
        expires_at: { type: string, format: date-time }
        rp_id: { type: string }
        allow_credentials: { type: array, items: { type: string }, description: 作業員のパスキーの credential id }

    CheckInEvent:
      type: object
      description: サーバーが確定し、作業員のパスキーが署名するイベント（spec/PROTOCOL.md）。
      required: [v, type, checkin_id, device_id, site_id, nonce, issued_at, location, attributes]
      properties:
        v: { const: 2 }
        type: { type: string, example: site_entry }
        checkin_id: { type: string }
        device_id: { type: string }
        site_id: { type: string }
        nonce: { type: string, description: サーバーの乱数 32 バイト（base64url） }
        issued_at: { type: string, description: サーバーの時刻（UTC）, example: "2026-11-08T22:58:12.000Z" }
        location:
          type: object
          required: [lat_e7, lng_e7, accuracy_m]
          properties:
            lat_e7: { type: integer, description: 緯度 × 10^7 }
            lng_e7: { type: integer, description: 経度 × 10^7 }
            accuracy_m: { type: integer }
        attributes: { type: object }

    CheckInResult:
      type: object
      required: [checkin_id, status, flags, billable, distance_m]
      properties:
        checkin_id: { type: string }
        status: { type: string, enum: [accepted, duplicate] }
        flags: { type: array, items: { $ref: "#/components/schemas/Flag" } }
        billable: { type: boolean }
        distance_m: { type: integer, description: 現場の中心からの距離（メートル） }

    CheckInErrorCode:
      type: string
      description: 打刻の申請と完了で返るエラーコード
      enum:
        - malformed_request
        - unknown_event_type
        - unknown_device
        - unknown_site
        - site_location_missing
        - no_passkey
        - unknown_checkin
        - checkin_expired
        - unknown_credential
        - credential_device_mismatch
        - invalid_signature

    Flag:
      type: string
      enum: [outside_site, low_accuracy, unassigned_site]
      description: "outside_site: 現場の半径 + 精度より遠い。low_accuracy: 精度が 100 m より悪い。unassigned_site: その日に割り当てのない現場"

    CheckInRow:
      type: object
      properties:
        checkin_id: { type: string }
        device_id: { type: string }
        type: { type: string }
        billable: { type: boolean }
        site_time: { type: integer, description: 打刻の時刻（サーバー、unix 秒） }
        local_date: { type: string, format: date }
        issued_at: { type: string }
        latitude_e7: { type: integer }
        longitude_e7: { type: integer }
        accuracy_m: { type: integer }
        distance_m: { type: integer, description: 現場の中心からの距離（メートル） }
        flags: { type: array, items: { $ref: "#/components/schemas/Flag" } }
        received_at: { type: string, format: date-time }
        site_id: { type: string }
        site_name: { type: string }
        time_zone: { type: string }
        worker_id: { type: string }
        worker_name: { type: string }
        credential_id: { type: string }
